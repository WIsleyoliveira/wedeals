name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wedeals
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wedeals/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm run test:unit

      - name: Testes de integração
        run: npm run test:integration

      - name: Testes de segurança
        run: npm run test:security

      - name: Testes E2E
        run: npm run test:e2e

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

  browser:
    name: Testes no navegador
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wedeals
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wedeals/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium (headless)
        run: npx playwright install --with-deps --only-shell chromium

      - name: Dashboard no navegador
        run: npm run test:browser

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t wedeals:ci wedeals

      - name: Smoke test
        run: |
          docker run -d --name wedeals -p 3100:3100 -e ADMIN_TOKEN=ci-token-com-mais-de-24-caracteres wedeals:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health; then exit 0; fi
            sleep 1
          done
          docker logs wedeals
          exit 1

      - name: Validar compose
        working-directory: wedeals
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production config --quiet
